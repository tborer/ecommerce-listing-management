[project]
name = "ecommerce-listing-mgmt"
version = "0.1.0"
description = "eBay / AliExpress / DSers / WooCommerce dropship listing automation -- staging ground for a future web app"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "httpx2",
    "pytesseract",
    "Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Offline unit tests only. tests/test_ebay_auth.py and tests/test_woocommerce.py
# are live-account scripts (real eBay/WooCommerce calls) run by hand, not by pytest.
testpaths = ["tests/unit"]
