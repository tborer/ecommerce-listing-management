[project]
name = "ecommerce-listing-mgmt"
version = "0.1.0"
description = "eBay / CJdropshipping / DSers dropship listing automation, plus the web app API over it"
requires-python = ">=3.11"
# Base install = what the web app API needs (this is what Vercel installs).
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
# The cron-driven pipeline on the original host (DSers MCP client, OCR enrichment).
pipeline = [
    "mcp",
    "httpx2",
    "pytesseract",
    "Pillow",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Offline unit tests only. tests/test_ebay_auth.py and tests/test_woocommerce.py
# are live-account scripts (real eBay/WooCommerce calls) run by hand, not by pytest.
testpaths = ["tests/unit"]

[tool.vercel]
# The web app API (FastAPI). app.py at the repo root puts src/ on sys.path.
entrypoint = "app:app"
